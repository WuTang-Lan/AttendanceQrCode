<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Lecturer Dashboard</h1>
            <div id="sessionStatus" class="status">No active session</div>
            <p id="timer" style="text-align: center; margin: 10px 0; font-weight: bold;"></p>
            
            <div id="sessionControls" style="margin: 20px 0;">
                <div class="form-group">
                    <label for="courseName">Course Name:</label>
                    <input type="text" id="courseName" placeholder="e.g., Computer Science 101" required>
                </div>
                <button id="startBtn" onclick="startSession()" class="btn">Start New Session</button>
                <button id="stopBtn" onclick="stopSession()" class="btn btn-secondary" style="display: none;">Stop Session</button>
            </div>
            
            <div id="qrContainer" class="qr-container" style="display: none;">
                <h3>IRVR Code - Scan to Mark Attendance</h3>
                <img id="qrCode" alt="IRVR Code" />
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    <strong>Auto-refreshing code:</strong> This code expires every 5 minutes and automatically generates a new one. Session remains active until you stop it.
                </p>
            </div>
            
            <h3>Recent Attendance Records</h3>
            <div id="attendanceList" class="attendance-list">
                <p>Start a session to view attendance</p>
            </div>
            
            <button onclick="window.location.href='/'" class="btn btn-secondary">Logout</button>
        </div>
    </div>
    <script src="js/lecturer.js"></script>
</body>
</html>
